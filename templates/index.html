<!DOCTYPE html>
<html>
<head>
    <title>Fraud Detection System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h2>Online Payment Fraud Detection</h2>

    <form method="POST" action="/predict">
        <label>Step:</label>
        <input type="number" name="step" required>

        <label>Amount:</label>
        <input type="number" step="0.01" name="amount" required>

        <label>Old Balance (Sender):</label>
        <input type="number" step="0.01" name="oldbalanceOrg" required>

        <label>New Balance (Sender):</label>
        <input type="number" step="0.01" name="newbalanceOrig" required>

        <label>Old Balance (Receiver):</label>
        <input type="number" step="0.01" name="oldbalanceDest" required>

        <label>New Balance (Receiver):</label>
        <input type="number" step="0.01" name="newbalanceDest" required>

        <label>Transaction Type:</label>
        <select name="type" required>
            <option value="CASH_OUT">CASH_OUT</option>
            <option value="DEBIT">DEBIT</option>
            <option value="PAYMENT">PAYMENT</option>
            <option value="TRANSFER">TRANSFER</option>
        </select>

        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
    <div class="result">
        <h3>Prediction: {{ prediction }}</h3>
        <p>Fraud Probability: {{ probability }}</p>
    </div>
    {% endif %}
</div>

</body>
</html>
